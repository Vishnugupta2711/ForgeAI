# ForgeAI default configuration

[models]
agent = "qwen2.5:3b-instruct"
judge = "llama3.1:8b"
eval_writer = "llama3.1:8b"
embed = "nomic-embed-text"

[endpoints]
ollama_base_url = "http://localhost:11434"
openai_compat_base_url = ""
timeout_seconds = 120.0

[generation]
temperature = 0.0
seed = 42
max_retries = 3

[budgets]
max_iterations = 3
max_intake_questions = 5
max_tokens_per_run = 250000
max_latency_seconds_per_run = 900.0
min_improvement_delta = 0.02

[cache]
enabled = true
dir = ".cache/llm"
